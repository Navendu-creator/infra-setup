# Terraform CI/CD for terraform/aws/environments/<env>
#
# Required GitHub configuration (Settings -> Secrets and variables -> Actions):
#   Secrets:
#     AWS_ACCESS_KEY_ID       IAM user access key used by Terraform
#     AWS_SECRET_ACCESS_KEY   IAM user secret key
#   Variables (optional):
#     AWS_REGION              defaults to us-east-1
#     TF_ENVIRONMENT          environment used on PR / push, defaults to dev
#     TF_VERSION              Terraform version, defaults to 1.13.4 (>= 1.10 needed for S3 use_lockfile)
#
# Also create a GitHub Environment per Terraform environment (Settings -> Environments,
# e.g. "dev") and add required reviewers to it: apply and destroy wait for approval there.
#
# Flow:
#   pull_request     -> validate + plan (plan posted as a PR comment)
#   push to main     -> validate + plan + apply (gated by the GitHub Environment)
#   workflow_dispatch-> plan | apply | destroy for a chosen environment

name: terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/aws/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/aws/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment folder under terraform/aws/environments"
        type: choice
        options:
          - dev
          - test
        default: dev
      action:
        description: "What to run"
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan
      confirm:
        description: "For destroy only: type the environment name to confirm"
        type: string
        required: false

permissions:
  contents: read
  pull-requests: write

env:
  TF_ENVIRONMENT: ${{ inputs.environment || vars.TF_ENVIRONMENT || 'dev' }}
  TF_DIR: terraform/aws/environments/${{ inputs.environment || vars.TF_ENVIRONMENT || 'dev' }}
  TF_VERSION: ${{ vars.TF_VERSION || '1.13.4' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

# Never run two Terraform jobs against the same state at once, and never cancel a running apply.
concurrency:
  group: terraform-${{ inputs.environment || vars.TF_ENVIRONMENT || 'dev' }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate (${{ inputs.environment || vars.TF_ENVIRONMENT || 'dev' }})
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Non-blocking for now: existing modules are not fmt-clean yet.
      - name: terraform fmt
        working-directory: terraform/aws
        continue-on-error: true
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate -no-color

  plan:
    name: plan (${{ inputs.environment || vars.TF_ENVIRONMENT || 'dev' }})
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform init -reconfigure

      - name: terraform plan
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Plan summary
        run: |
          {
            echo "### Terraform plan: \`${TF_ENVIRONMENT}\`"
            echo '<details><summary>Show plan</summary>'
            echo
            echo '```terraform'
            head -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync(`${process.env.TF_DIR}/plan.txt`, 'utf8');
            if (plan.length > 60000) {
              plan = plan.slice(0, 60000) + '\n... (truncated, see the job log)';
            }
            const body = [
              `### Terraform plan: \`${process.env.TF_ENVIRONMENT}\``,
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });

      # The saved plan can contain sensitive values, so keep it only as long as the apply needs it.
      - name: Upload plan
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.TF_ENVIRONMENT }}-${{ github.run_id }}
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 1

  apply:
    name: apply (${{ inputs.environment || vars.TF_ENVIRONMENT || 'dev' }})
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    environment: ${{ inputs.environment || vars.TF_ENVIRONMENT || 'dev' }}
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform init -reconfigure

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.TF_ENVIRONMENT }}-${{ github.run_id }}
          path: ${{ env.TF_DIR }}

      # Applies exactly what was planned; fails if state changed since the plan.
      - name: terraform apply
        run: terraform apply -no-color tfplan

      - name: Outputs
        run: terraform output -no-color

  destroy:
    name: destroy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - name: Check confirmation
        working-directory: .
        run: |
          if [ "${{ inputs.confirm }}" != "${{ inputs.environment }}" ]; then
            echo "::error::Type the environment name ('${{ inputs.environment }}') in 'confirm' to destroy it."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform init -reconfigure

      # LoadBalancer Services create NLBs outside Terraform; remove them first so
      # subnet / IGW deletion doesn't hang on orphaned ENIs.
      - name: Remove Kubernetes LoadBalancers
        continue-on-error: true
        run: |
          CLUSTER=$(terraform output -raw cluster_name 2>/dev/null || true)
          if [ -z "$CLUSTER" ] || ! aws eks describe-cluster --name "$CLUSTER" >/dev/null 2>&1; then
            echo "No EKS cluster found, skipping."
            exit 0
          fi
          aws eks update-kubeconfig --name "$CLUSTER"
          kubectl get svc -A -o json \
            | jq -r '.items[] | select(.spec.type == "LoadBalancer") | "\(.metadata.namespace) \(.metadata.name)"' \
            | while read -r ns name; do
                echo "Deleting service $ns/$name"
                kubectl delete svc "$name" -n "$ns" --timeout=120s || true
              done
          echo "Waiting 90s for AWS to deprovision load balancers..."
          sleep 90

      - name: terraform destroy
        run: terraform destroy -no-color -auto-approve
